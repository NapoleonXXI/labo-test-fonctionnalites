<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Itérations – labo</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#EDEDED;color:#1A1A1A;font:15px/1.4 Geist,system-ui,sans-serif}
h1{font-size:20px;font-weight:600;margin:0}
#lotv{position:absolute;top:8px;left:16px;font-size:14px;font-weight:500;color:#6B6B6B}
.top{display:flex;align-items:center;justify-content:space-between;max-width:1160px;margin:0 auto;padding:34px 20px 0}
.nav{display:flex;gap:8px}
.back{color:#1A1A1A;font-weight:500;font-size:14px;background:#fff;border-radius:10px;padding:7px 14px;text-decoration:none}
main{max-width:1120px;margin:0 auto;padding:4px 20px 40px}
section{margin-top:24px}
.vd{font-size:14px;margin:0 0 8px}
.vd b{font-weight:600}
.caps{display:flex;flex-wrap:wrap;gap:14px}
.caps img{display:block;max-width:100%;height:auto}
</style>
</head>
<body>
<div id="lotv">Lot 4</div>
<div class="top"><h1>Itérations</h1><div class="nav"><a class="back" href="test.html">Vue de test</a><a class="back" href="elements.html">Éléments graphiques et textuels</a></div></div>
<main id="it"></main>
<script>
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const T = Date.now();
fetch('iterations.json?t=' + T, { cache: 'no-store' }).then(r => r.json()).then(d => {
  document.getElementById('it').innerHTML = (d.iterations || []).map(i => `<section><p class="vd"><b>Version ${esc(i.v)}</b> · ${esc(i.date)}</p><div class="caps">${(i.captures || []).map(c => `<img src="${esc(c)}?t=${T}" alt="Version ${esc(i.v)}" loading="lazy">`).join('')}</div></section>`).join('');
});
</script>
</body>
</html>
