<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Labo test fonctionnalités</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#EDEDED;color:#1A1A1A;font:15px/1.4 Geist,system-ui,sans-serif;overflow:hidden}
.bar{position:fixed;top:0;left:0;right:0;height:52px;padding:0 12px;z-index:5;display:flex;gap:8px;align-items:center;justify-content:flex-start;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.bar::-webkit-scrollbar{display:none}
.bar>*{flex:none;white-space:nowrap}
.sw{display:inline-flex;background:#fff;border-radius:10px;padding:3px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sw button{border:0;background:none;font:inherit;font-size:14px;font-weight:500;padding:6px 14px;border-radius:8px;color:#6B6B6B;cursor:pointer}
.sw button[aria-pressed=true]{background:#1A1A1A;color:#fff}
select.rp{border:0;font:inherit;font-size:14px;font-weight:500;cursor:pointer}
.rp{background:#fff;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:500;color:#1A1A1A;text-decoration:none;box-shadow:0 1px 3px rgba(0,0,0,.12)}
#stage{position:fixed;top:52px;left:0;right:0;bottom:0}
.std iframe{border:0;width:100%;height:100%;display:block}
.mob{display:flex;align-items:center;justify-content:center}
.phone{border:10px solid #1A1A1A;border-radius:44px;overflow:hidden;width:410px;height:864px;flex:none;transform-origin:center}
.phone iframe{border:0;width:390px;height:844px;display:block}
#lotv{margin-right:auto;font-size:14px;font-weight:500;color:#6B6B6B}
.mob.full iframe{border:0;width:100%;height:100%;display:block}
@media (max-width:600px){.bar{gap:6px;padding:0 8px}.sw button{padding:6px 10px;font-size:13px}.rp{padding:8px 10px;font-size:13px}#lotv{font-size:13px}}
</style>
</head>
<body>
<div class="bar">
  <div id="lotv">Lot 9</div>
  <div class="sw" role="group" aria-label="Affichage"><button type="button" data-m="0" aria-pressed="true">Standard</button><button type="button" data-m="1" aria-pressed="false">Mobile</button></div>
  <select class="rp" id="role" aria-label="Rôle"><option value="responsable_tech">Responsable technique</option><option value="technicien">Technicien</option><option value="reception">Réceptionniste</option></select>
  <a class="rp" id="full" href="app/lab.html?m=0" target="_blank">Ouvrir en plein écran</a>
  <a class="rp" href="elements.html">Éléments graphiques et textuels</a>
</div>
<div id="stage"></div>
<script>
const stage = document.getElementById('stage');
// Lot 7 : sur téléphone (≤ 600 px), ouverture directe en Mobile, l'appli remplit l'écran (sans cadre de téléphone).
const PH = matchMedia('(max-width: 600px)').matches, MK = PH ? 'labo:mp' : 'labo:m';
let M = PH ? (localStorage.getItem(MK) === '0' ? '0' : '1') : (localStorage.getItem(MK) === '1' ? '1' : '0');
const sel = document.getElementById('role'); sel.value = localStorage.getItem('labo:r') || 'responsable_tech'; if (!sel.value) sel.value = 'responsable_tech';
sel.onchange = () => { localStorage.setItem('labo:r', sel.value); show(); };
function show() {
  document.querySelectorAll('.sw button').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === M));
  stage.className = M === '1' ? (PH ? 'mob full' : 'mob') : 'std';
  const src = `app/lab.html?m=${M}&r=${sel.value}&v=1795024118`; document.getElementById('full').href = src;
  stage.innerHTML = M === '1' && !PH
    ? `<div class="phone"><iframe src="${src}" title="Nouvelle intervention, vue mobile"></iframe></div>`
    : `<iframe src="${src}" title="Nouvelle intervention, vue standard"></iframe>`;
  fit();
}
function fit() {
  const p = stage.querySelector('.phone'); if (!p) return;
  const k = Math.min(1, (stage.clientHeight - 24) / 864, (innerWidth - 24) / 410);
  p.style.transform = k < 1 ? `scale(${k})` : '';
}
document.querySelector('.sw').onclick = e => { const b = e.target.closest('button'); if (!b || b.dataset.m === M) return; M = b.dataset.m; localStorage.setItem(MK, M); show(); };
addEventListener('resize', fit);
// Lot 7 : clavier iOS ouvert : la zone de test suit la partie visible de l'écran (visualViewport), sans bande ni contenu masqué.
const vv = window.visualViewport; if (vv) { const vfit = () => { const b = document.querySelector('.bar'); b.style.top = vv.offsetTop + 'px'; stage.style.top = (vv.offsetTop + 52) + 'px'; stage.style.bottom = 'auto'; stage.style.height = Math.max(0, vv.height - 52) + 'px'; fit(); }; vv.addEventListener('resize', vfit); vv.addEventListener('scroll', vfit); vfit(); }
show();
</script>
</body>
</html>
