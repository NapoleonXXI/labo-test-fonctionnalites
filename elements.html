<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Éléments graphiques et textuels – labo</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#EDEDED;color:#1A1A1A;font:15px/1.4 Geist,system-ui,sans-serif}
h1{font-size:20px;font-weight:600;margin:0}
h2{font-size:17px;font-weight:600;margin:28px 0 6px}
h3{font-size:14px;font-weight:600;margin:18px 0 8px;color:#3A3A3A}
#lotv{position:absolute;top:8px;left:16px;font-size:14px;font-weight:500;color:#6B6B6B}
.top{display:flex;align-items:center;justify-content:space-between;max-width:1160px;margin:0 auto;padding:34px 20px 0}
.nav{display:flex;gap:8px}
.back{color:#1A1A1A;font-weight:500;font-size:14px;background:#fff;border-radius:10px;padding:7px 14px;text-decoration:none}
main{max-width:1120px;margin:0 auto;padding:4px 20px 40px}
.muted{color:#6B6B6B;font-size:13px;margin:0}
.grid{display:flex;flex-wrap:wrap;gap:14px 18px;align-items:flex-start}
figure{margin:0;max-width:320px}
figure img{display:block;max-width:100%;height:auto}
figcaption{font-size:12px;color:#3A3A3A;margin-top:4px;line-height:1.35}
figcaption b{font-weight:600;color:#1A1A1A}
.full img{display:block;max-width:100%;height:auto;margin-bottom:14px}
</style>
</head>
<body>
<div id="lotv">Lot 5</div>
<div class="top"><h1>Éléments graphiques et textuels</h1><div class="nav"><a class="back" href="test.html">Vue de test</a><a class="back" href="./">Itérations</a></div></div>
<main id="el"><p class="muted">Chargement…</p></main>
<script>
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const T = Date.now();
// Images 2x : affichées à leur taille réelle (moitié de la largeur en pixels).
const im = (f, alt) => `<img src="elements/${esc(f)}?t=${T}" alt="${esc(alt)}" loading="lazy" onload="this.style.width=(this.naturalWidth/2)+'px'">`;
fetch('elements/manifest.json?t=' + T, { cache: 'no-store' }).then(r => r.json()).then(M => {
  const cats = [...new Set(M.boutons.map(b => b.cat))];
  const src = [...new Set(M.boutons.map(b => b.source))];
  let h = `<h2>Boutons</h2><p class="muted">Captures PNG ×2 générées avec Playwright. Sources : ${src.map(esc).join(' ; ')}. Rôles testés dans le labo : Responsable technique, Technicien, Réceptionniste ; vues standard 1180 px et mobile 390 px.</p>`;
  for (const c of cats) {
    h += `<h3>${esc(c)}</h3><div class="grid">` + M.boutons.filter(b => b.cat === c).map(b => `<figure>${im(b.file, b.label)}<figcaption><b>${esc(b.label)}</b> · ${esc(b.vue)}<br><code>${esc(b.classe)}</code> · ${esc(b.zone)}<br>${b.roles.length ? 'Rôles : ' + esc(b.roles.join(', ')) + '<br>' : ''}${b.source.startsWith('Spécimen') ? 'Source : spécimen (vrai app.css)' : 'Source : copie du labo'}</figcaption></figure>`).join('') + '</div>';
  }
  h += `<h2>Typographies</h2><p class="muted">Relevées sur les styles calculés de la copie du labo (app.css de gestion-interventions).</p><div class="full">${M.typographies.map(f => im(f, 'Typographies')).join('')}</div>`;
  h += `<h2>Marges et espacements</h2><p class="muted">Relevés sur les styles calculés de la copie du labo : marges intérieures, espacements, marges extérieures, rayons.</p><div class="full">${M.marges.map(m => im(m.file, m.titre)).join('')}</div>`;
  document.getElementById('el').innerHTML = h;
}).catch(() => { document.getElementById('el').innerHTML = '<p class="muted">Manifeste illisible.</p>'; });
</script>
</body>
</html>
